[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bazarblot"
version = "0.1.0"
description = "Deep RL environment for Bazar Blot (Armenian Bazaar Belote)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# core/ deliberately has NO runtime dependencies beyond the stdlib + pyyaml.
# The rules engine must stay importable and testable in isolation, and fast.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
env = [
    # Capped below 2.1: numpy's bundled type stubs start using PEP 695 `type` alias syntax
    # around there, which mypy can only parse under `python_version >= "3.12"` — a hard
    # SyntaxError under this project's `python_version = "3.11"` mypy target (§ requires-python
    # says >=3.11, and mypy is meant to actually verify that floor, not just the interpreter
    # that happens to run it). Revisit the cap once the project's minimum Python moves to 3.12.
    "numpy>=1.26,<2.1",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
]
learn = [
    "torch>=2.2",
    "tensorboard>=2.16",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bazarblot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not slow\""
markers = [
    "slow: property/fuzz tests with large sample counts (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["bazarblot"]
mypy_path = "src"
strict = true
warn_unreachable = true

# ui/ is a thin FastAPI presentation layer, not the foundation everything else builds on
# (that's core/) — full strict mode buys little here against route-handler boilerplate.
[[tool.mypy.overrides]]
module = "bazarblot.ui.*"
disallow_untyped_defs = false
warn_unused_ignores = false

# Neither ships a py.typed marker / stub package.
[[tool.mypy.overrides]]
module = ["pettingzoo.*", "pettingzoo"]
ignore_missing_imports = true

# `AECEnv` resolves to `Any` because pettingzoo ships no stubs (see the override above); strict
# mode's `disallow_subclassing_any` would otherwise reject `class BazarBlotAEC(AECEnv)` itself,
# which is unavoidable — it's the actual PettingZoo API this module implements.
[[tool.mypy.overrides]]
module = "bazarblot.env.aec"
disallow_subclassing_any = false

# torch ships incomplete stubs for torch.distributions (Categorical.sample/log_prob/entropy) and
# Tensor.backward — real methods on a real, well-typed library, just not annotated in the stub
# package strict mode can see. `disallow_untyped_calls` would otherwise reject calling them at
# every single use site in the M7 training code; relaxed here rather than sprinkling
# `# type: ignore[no-untyped-call]` over ~25 call sites for a gap that is torch's, not this
# module's.
[[tool.mypy.overrides]]
module = ["bazarblot.agents.nn.*", "bazarblot.learn.*"]
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/bazarblot"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
