name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev,ui]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests (fast tier — excludes `slow`)
        run: pytest -q --cov=bazarblot --cov-report=term-missing

      # The engine is the foundation every result inherits; a coverage gap there is a
      # correctness gap.
      - name: Coverage floor for core/
        run: |
          coverage report --include="src/bazarblot/core/*" --fail-under=95

      # `slow`-marked tests (larger random-playout sample counts) run every CI build too —
      # they're currently cheap (~5s for 20k deals) — but stay a separate step so a future,
      # genuinely expensive nightly-scale run can be split out without touching the fast tier.
      - name: Tests (slow tier)
        run: pytest -q -m slow
