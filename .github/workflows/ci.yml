name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly (Mondays 06:00 UTC): runs the slow tier below

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch first: the default Linux wheel bundles CUDA (multi-GB) and CI has no GPU.
      # Installing it before the project means `.[learn]`'s `torch>=2.2` is already satisfied
      # and pip won't pull the CUDA build over it.
      - name: Install torch (CPU wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `env` (numpy, pettingzoo, gymnasium) and `learn` (torch, tensorboard) are needed by
      # mypy and the test suite, not just at runtime -- `.[dev,ui]` alone leaves every
      # `bazarblot.env`/`agents.nn`/`learn` import unresolvable.
      - run: pip install -e ".[dev,ui,env,learn]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests (fast tier — excludes `slow`)
        run: pytest -q --cov=bazarblot --cov-report=term-missing

      # The engine is the foundation every result inherits; a coverage gap there is a
      # correctness gap.
      - name: Coverage floor for core/
        run: |
          coverage report --include="src/bazarblot/core/*" --fail-under=95

  # The `slow`-marked tests are full double-dummy solves (minutes each; the whole tier took over
  # 30 minutes on a GitHub runner), so they stay out of the per-push loop. They run weekly and on
  # demand (`gh workflow run CI`) on a single Python version.
  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -e ".[dev,ui,env,learn]"

      - name: Tests (slow tier)
        run: pytest -q -m slow
